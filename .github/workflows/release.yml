name: Build and Release APK

on:
  push:
    tags:
      - 'v*' # Trigger only when you push a tag starting with 'v' (e.g., v1.0.1)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create the release
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Regenerate Gradle Wrapper
        run: ./gradlew wrapper --gradle-version 8.4 # Using a stable, recent version

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release-unsigned.apk # Note: This will be unsigned
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          draft: false
          prerelease: false
          body: |
            Automated Release for ${{ github.ref_name }}
            Check update-manifest.json for details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
